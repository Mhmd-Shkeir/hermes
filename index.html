<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Web Calculator</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Basic Web Calculator</h1>
        <p>A simple calculator for basic arithmetic operations</p>
    </header>
    <div class="calculator">
        <div class="display">
            <div id="expression" class="expression"></div>
            <div id="result" class="result"></div>
        </div>
        <div class="buttons">
            <button class="btn clear" id="clear">C</button>
            <button class="btn backspace" id="backspace">⌫</button>
            <button class="btn divide" id="divide">÷</button>
            <button class="btn multiply" id="multiply">×</button>
            <button class="btn btn-7" id="btn-7">7</button>
            <button class="btn btn-8" id="btn-8">8</button>
            <button class="btn btn-9" id="btn-9">9</button>
            <button class="btn subtract" id="subtract">-</button>
            <button class="btn btn-4" id="btn-4">4</button>
            <button class="btn btn-5" id="btn-5">5</button>
            <button class="btn btn-6" id="btn-6">6</button>
            <button class="btn add" id="add">+</button>
            <button class="btn btn-1" id="btn-1">1</button>
            <button class="btn btn-2" id="btn-2">2</button>
            <button class="btn btn-3" id="btn-3">3</button>
            <button class="btn equals" id="equals">=</button>
            <button class="btn btn-0" id="btn-0">0</button>
            <button class="btn decimal" id="decimal">.</button>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
